<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DharaaBot - AI Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f3f4f6;
    }
    .chatbot-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 90vw;
      max-width: 400px;
      height: 80vh;
      max-height: 550px;
      background: white;
      border-radius: 1rem;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: all 0.3s ease;
      transform: translateY(100vh);
      z-index: 999;
    }
    .chatbot-container.open {
      transform: translateY(0);
    }
    #chat-history {
      flex-grow: 1;
      overflow-y: auto;
      padding: 1rem;
      background-color: #f9fafb;
      scroll-behavior: smooth;
    }
    .message-bubble {
      max-width: 85%;
      padding: 0.75rem 1rem;
      border-radius: 1rem;
      margin-bottom: 0.75rem;
      line-height: 1.4;
    }
    .user-message {
      background-color: #1f2937;
      color: white;
      align-self: flex-end;
    }
    .ai-message {
      background-color: #e5e7eb;
      color: #1f2937;
      align-self: flex-start;
    }
    .chatbot-toggler {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 60px;
      height: 60px;
      border-radius: 9999px;
      background-color: #1f2937;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      z-index: 1000;
    }
    .material-icons { font-size: 24px; }
  </style>
</head>
<body>
  <!-- Toggle Button -->
  <button id="chatbot-toggler" class="chatbot-toggler">
    <span class="material-icons open-icon">forum</span>
  </button>

  <!-- Chatbot Container -->
  <div id="chatbot-popup" class="chatbot-container">
    <div class="p-4 bg-gray-900 text-white flex justify-between items-center">
      <div class="flex items-center">
        <span class="material-icons text-green-400 mr-2">smart_toy</span>
        <h3 class="text-xl font-semibold">DharaaBot</h3>
      </div>
      <button id="close-chat" class="p-1 rounded-full hover:bg-gray-700">
        <span class="material-icons">close</span>
      </button>
    </div>

    <div id="chat-history" class="flex flex-col">
      <div class="flex justify-start">
        <div class="ai-message message-bubble">
          Hello! I'm your DharaaBot assistant. How can I help you today?
        </div>
      </div>
    </div>

    <div class="p-4 border-t border-gray-200">
      <form id="chat-form" class="flex gap-2">
        <input id="user-input" type="text" placeholder="Type your message..." class="flex-grow p-3 border border-gray-300 rounded-lg" />
        <button id="send-btn" type="submit" class="bg-indigo-600 text-white p-3 rounded-lg">
          <span class="material-icons">send</span>
        </button>
      </form>
    </div>
  </div>

  <!-- Chatbot Logic -->
  <script>
    const chatPopup = document.getElementById('chatbot-popup');
    const chatToggler = document.getElementById('chatbot-toggler');
    const chatForm = document.getElementById('chat-form');
    const chatHistoryEl = document.getElementById('chat-history');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    chatToggler.addEventListener('click', () => chatPopup.classList.toggle('open'));
    document.getElementById('close-chat').addEventListener('click', () => chatPopup.classList.remove('open'));
    
    

    const apiUrl = "http://127.0.0.1:5000/chat";  // Flask endpoint
    

    const createMessage = (text, sender) => {
      const div = document.createElement('div');
      div.classList.add('flex', sender === 'user' ? 'justify-end' : 'justify-start');
      const bubble = document.createElement('div');
      bubble.classList.add('message-bubble', sender === 'user' ? 'user-message' : 'ai-message');
      bubble.textContent = text;
      div.appendChild(bubble);
      chatHistoryEl.appendChild(div);
      chatHistoryEl.scrollTop = chatHistoryEl.scrollHeight;
    };

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const userMessage = userInput.value.trim();
      if (!userMessage) return;
      createMessage(userMessage, 'user');
      userInput.value = '';
      sendBtn.disabled = true;

      try {
        const res = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: userMessage })
        });

        const data = await res.json();
        if (data.reply) createMessage(data.reply, 'ai');
        else createMessage("⚠️ Sorry, something went wrong.", 'ai');
      } catch (err) {
        console.error(err);
        createMessage("❌ Error connecting to server.", 'ai');
      } finally {
        sendBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
